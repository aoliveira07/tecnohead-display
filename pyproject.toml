[project]
name = "tecnohead-display"
version = "0.10.1"
description = "Painel touch em vidro laranja para o Home Assistant."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

